name: PR Smoke Test

# ── Triggered by /smoke-test comment or run-smoke label ────────────────────
# Runs Kafka connectivity checks — no apps needed, always safe.

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  context:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/smoke-test')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-smoke')
    uses: trading-cz/github-action/.github/workflows/pr-context.yml@main

  test:
    needs: context
    uses: trading-cz/testing/.github/workflows/test-smoke.yml@main
    with:
      app_repo: ${{ needs.context.outputs.repo }}
      app_branch: ${{ needs.context.outputs.branch }}
      pr_number: ${{ needs.context.outputs.pr_number }}
