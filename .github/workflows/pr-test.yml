name: PR Test

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      markers: ${{ steps.cmd.outputs.markers }}
      label: ${{ steps.cmd.outputs.label }}
      sha: ${{ steps.pr.outputs.sha }}
      ref: ${{ steps.pr.outputs.ref }}
    steps:
      - name: Check if PR comment
        id: check
        run: |
          if [ "${{ github.event.issue.pull_request }}" = "" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Parse command
        if: steps.check.outputs.skip != 'true'
        id: cmd
        run: |
          BODY="${{ github.event.comment.body }}"
          case "$BODY" in
            "/test")
              echo "markers=smoke or regression" >> $GITHUB_OUTPUT
              echo "label=all" >> $GITHUB_OUTPUT ;;
            "/smoke-test")
              echo "markers=smoke" >> $GITHUB_OUTPUT
              echo "label=smoke" >> $GITHUB_OUTPUT ;;
            "/regression-test")
              echo "markers=regression" >> $GITHUB_OUTPUT
              echo "label=regression" >> $GITHUB_OUTPUT ;;
            "/integration-test")
              echo "markers=integration" >> $GITHUB_OUTPUT
              echo "label=integration" >> $GITHUB_OUTPUT ;;
            *)
              echo "markers=none" >> $GITHUB_OUTPUT
              echo "label=none" >> $GITHUB_OUTPUT ;;
          esac

      - name: Get PR details
        if: steps.check.outputs.skip != 'true' && steps.cmd.outputs.markers != 'none'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.head.sha);
            core.setOutput('ref', pr.head.ref);

  test:
    needs: parse
    if: needs.parse.outputs.markers != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build and install SDK
        run: |
          pip install build
          python -m build
          WHEEL=$(ls dist/*.whl | head -1)
          echo "Built: $WHEEL"
          pip install "$WHEEL"
          echo "wheel_path=$WHEEL" >> $GITHUB_ENV

      - name: Resolve testing branch
        id: testing
        run: |
          BRANCH="${{ needs.parse.outputs.ref }}"
          if git ls-remote --heads https://github.com/trading-cz/testing "$BRANCH" | grep -q "$BRANCH"; then
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          else
            echo "branch=main" >> $GITHUB_OUTPUT
          fi

      - name: Checkout testing repo
        uses: actions/checkout@v4
        with:
          repository: trading-cz/testing
          path: ../testing
          ref: ${{ steps.testing.outputs.branch }}

      - name: Install testing deps
        run: |
          cd ../testing
          pip install -e .

      - name: Start Kafka
        run: |
          cd ../testing
          docker compose up -d kafka
          for i in $(seq 1 30); do
            if docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka ready"
              break
            fi
            sleep 2
          done

      - name: Setup strategy (regression/integration)
        if: needs.parse.outputs.label == 'regression' || needs.parse.outputs.label == 'integration' || needs.parse.outputs.label == 'all'
        run: |
          git clone --depth 1 https://github.com/trading-cz/simple-strategy ../simple-strategy
          cd ../simple-strategy
          # Install with the SDK we just built (already installed)
          pip install -e .
          ENVIRONMENT=tst \
          KAFKA_BOOTSTRAP_SERVERS=localhost:9092 \
          STRATEGY_ID=atr3_open_stop \
          SYMBOLS='["SPY"]' \
          python main.py &
          sleep 5

      - name: Setup ingestion (integration only)
        if: needs.parse.outputs.label == 'integration' || needs.parse.outputs.label == 'all'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          git clone --depth 1 https://github.com/trading-cz/ingestion ../ingestion
          cd ../ingestion
          pip install -e .
          ENVIRONMENT=tst \
          KAFKA_BOOTSTRAP_SERVERS=localhost:9092 \
          SERVICE_TYPE=historical \
          ALPACA_FEED=sip \
          python main.py &
          sleep 5

      - name: Run tests
        id: pytest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          cd ../testing
          KAFKA_BOOTSTRAP_SERVERS=localhost:9092 \
          TEST_ENVIRONMENT=tst \
          python -m pytest tests/ \
            -v -m "${{ needs.parse.outputs.markers }}" \
            --tb=short \
            --junitxml=test-results.xml
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Post results comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const exitCode = '${{ steps.pytest.outputs.exit_code }}';

            let summary = '## 🧪 Test Results\n\n';
            summary += `**Trigger**: \`${{ github.event.comment.body }}\`\n`;
            summary += `**SDK branch**: \`${{ needs.parse.outputs.ref }}\`\n`;
            summary += `**Markers**: \`${{ needs.parse.outputs.markers }}\`\n\n`;

            if (exitCode === '0') {
              summary += '✅ All tests passed\n';
            } else {
              summary += '❌ Tests failed — check workflow logs for details\n';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary,
            });

      - name: Cleanup
        if: always()
        run: |
          pkill -f "python main.py" 2>/dev/null || true
          cd ../testing && docker compose down -v 2>/dev/null || true
