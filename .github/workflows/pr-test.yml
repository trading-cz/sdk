name: PR Test

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    uses: trading-cz/github-action/.github/workflows/pr-test.yml@main
    with:
      app_type: library
      app_name: sdk
      needs_alpaca: integration
    secrets:
      alpaca_api_key: ${{ secrets.ALPACA_API_KEY }}
      alpaca_secret_key: ${{ secrets.ALPACA_SECRET_KEY }}
