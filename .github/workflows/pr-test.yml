name: PR Test

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    uses: trading-cz/github-action/.github/workflows/pr-test.yml@main
    with:
      app_type: library
      app_name: sdk
      regression_partner: simple-strategy
      regression_env: |
        STRATEGY_ID=atr3_open_stop
        SYMBOLS=["SPY"]
